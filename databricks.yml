bundle:
  name: mlops

# `databricks bundle deploy` honors this (NOT .databricksignore). Keep the dev-proxy .npmrc,
# the full package-lock.json, and the swap backup out of the app upload so the platform's
# `npm install` uses the minimal package.json + its own default registry.
sync:
  # client/dist is the prebuilt frontend served in production, but .gitignore's `dist/` pattern
  # matches it — force-include it or the app serves "Cannot GET /".
  include:
    - client/dist/**
  exclude:
    - .npmrc
    - package-lock.json
    - package.json.bak
    - tests
    - "*.config.ts"
    - "tsconfig*.json"

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "mlops"
      description: "ML model lifecycle manager"
      source_code_path: ./

      user_api_scopes:
        - sql

      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

  jobs:
    # Demo data only (not part of the app): appends each day's synthetic transactions (catching up any
    # missed days) and refreshes `transactions_to_score`, the batch-inference demo input.
    demo_daily_transactions:
      name: mlops-demo-daily-transactions
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: generate
          notebook_task:
            notebook_path: ./demo/generate_daily_transactions.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"

targets:
  default:
    default: true
    workspace:
      host: https://fevm-serverless-stable-77rg2n.cloud.databricks.com

    variables:
      sql_warehouse_id: fec84293300374a5
