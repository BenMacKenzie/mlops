bundle:
  name: mlops

# `databricks bundle deploy` honors this (NOT .databricksignore). Keep the dev-proxy .npmrc,
# the full package-lock.json, and the swap backup out of the app upload so the platform's
# `npm install` uses the minimal package.json + its own default registry.
sync:
  # client/dist is the prebuilt frontend served in production, but .gitignore's `dist/` pattern
  # matches it — force-include it or the app serves "Cannot GET /".
  include:
    - client/dist/**
  exclude:
    - .npmrc
    - package-lock.json
    - package.json.bak
    - tests
    - "*.config.ts"
    - "tsconfig*.json"

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "mlops"
      description: "ML model lifecycle manager"
      source_code_path: ./

      user_api_scopes:
        - sql

      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    workspace:
      host: https://fevm-serverless-stable-77rg2n.cloud.databricks.com

    variables:
      sql_warehouse_id: fec84293300374a5
